<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring Insentif SC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="sheet.js"></script>
  <script src="nav.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-[#eef2f8] text-slate-900">

  <!-- Header, sama seperti Data Tim Sales -->
  <div class="mx-auto w-full max-w-xl px-5 pt-6 pb-4">
    <div class="flex items-center justify-between">
      <a href="index.html" class="flex h-11 w-11 items-center justify-center rounded-full bg-white shadow" aria-label="Kembali">
        <i data-lucide="arrow-left" class="h-5 w-5"></i>
      </a>
      <div class="text-center">
        <p class="text-[10px] font-semibold uppercase tracking-[0.2em] text-slate-400">Monitoring Insentif SC</p>
        <p class="text-base font-bold">Monitoring Insentif SC</p>
      </div>
      <button id="navToggle" class="flex h-11 w-11 items-center justify-center rounded-full bg-white shadow" aria-label="Menu">
        <i data-lucide="menu" class="h-5 w-5"></i>
      </button>
    </div>
  </div>

  <div class="mx-auto w-full max-w-xl px-4 pb-10">

    <!-- Kartu judul -->
    <div class="rounded-[28px] bg-[#0b0d12] p-6 text-white shadow-xl">
      <p class="text-[11px] font-semibold uppercase tracking-[0.2em] text-slate-400">Tim Tangerang · ASM Rizky Daniel</p>
      <h1 class="mt-2 text-2xl font-extrabold">Monitoring Insentif SC</h1>
      <p class="mt-1 text-sm text-slate-400">Daftar PSR</p>
    </div>

    <!-- Daftar PSR -->
    <div class="mt-4 rounded-[28px] bg-white p-5 shadow">
      <div class="flex items-center justify-between gap-3">
        <div>
          <p class="text-sm font-bold">Daftar PSR</p>
          <p id="jumlahPsr" class="text-xs text-slate-500">0 PSR</p>
        </div>
        <span id="statusBadge" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-500">Memuat</span>
      </div>

      <input id="cariPsr" type="search" placeholder="Cari nama PSR..."
             class="mt-4 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-slate-400">

      <p id="pesan" class="mt-4 hidden rounded-2xl bg-amber-50 px-4 py-3 text-sm text-amber-800"></p>

      <ul id="listPsr" class="mt-4 space-y-1"></ul>
      <p id="listKosong" class="hidden py-8 text-center text-sm text-slate-500">Tidak ada PSR.</p>
    </div>

  </div>

  <script>
    const el = id => document.getElementById(id);
    let semuaNama = [];

    function siap() {
      return typeof SheetData !== "undefined" && typeof SheetData.get === "function";
    }

    function escHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function normal(s) {
      return String(s ?? "").normalize("NFKC").replace(/\s+/g, " ").trim().toLocaleUpperCase("id-ID");
    }

    function ambilNamaPsr(d) {
      const header = d.header || [];
      let kolom = header.find(h => normal(h) === "NAMA PSR");
      if (!kolom) kolom = header.find(h => normal(h).includes("PSR"));
      if (!kolom) return [];

      const hasil = [];
      const sudah = new Set();
      for (const baris of d.objects || []) {
        const nama = String(baris[kolom] ?? "").trim();
        if (!nama) continue;
        const n = normal(nama);
        if (n.startsWith("TOTAL") || n.startsWith("JUMLAH")) continue;
        if (sudah.has(n)) continue;
        sudah.add(n);
        hasil.push(nama);
      }
      return hasil;
    }

    const LABEL_STATUS = {
      memuat: "Memuat",
      ok: "Terhubung",
      cache: "Terhubung",
      kosong: "Belum terhubung",
      error: "Gagal"
    };

    function tampilDaftar() {
      const q = normal(el("cariPsr").value);
      const hasil = semuaNama.filter(n => normal(n).includes(q));

      el("jumlahPsr").textContent = hasil.length + " PSR";
      el("listPsr").innerHTML = hasil.map((n, i) => `
        <li class="flex items-center gap-3 rounded-2xl px-3 py-3">
          <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-slate-100 text-xs font-bold text-slate-600">${i + 1}</span>
          <span class="text-sm font-semibold">${escHtml(n)}</span>
        </li>`).join("");
      el("listKosong").classList.toggle("hidden", hasil.length > 0);
    }

    function render() {
      const pesan = el("pesan");
      pesan.classList.add("hidden");
      semuaNama = [];

      if (!siap()) {
        el("statusBadge").textContent = "Gagal";
        pesan.textContent = "sheet.js belum termuat dengan benar. Periksa error sintaks di baris 26 sheet.js (koma di akhir baris sebelumnya).";
        pesan.classList.remove("hidden");
        tampilDaftar();
        return;
      }

      const d = SheetData.get("resumeGt");
      el("statusBadge").textContent = LABEL_STATUS[d.status] || d.status;

      if (d.status === "ok" || d.status === "cache") {
        semuaNama = ambilNamaPsr(d);
      } else if (d.status === "error") {
        pesan.textContent = "Data gagal dimuat. Pastikan tab resumeGt sudah dipublish sebagai CSV.";
        pesan.classList.remove("hidden");
      } else if (d.status === "kosong") {
        pesan.textContent = "Link resumeGt belum diisi di sheet.js.";
        pesan.classList.remove("hidden");
      }

      tampilDaftar();
    }

    el("cariPsr").addEventListener("input", tampilDaftar);
    if (siap() && typeof SheetData.onUpdate === "function") SheetData.onUpdate(render);
    render();
    lucide.createIcons();
  </script>
</body>
</html>
