<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Saya</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    input { width: 100%; padding: .6rem; margin-bottom: 1rem; font-size: 1rem; box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .5rem .75rem; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #f3f4f6; }
    #status { color: #666; font-size: .85rem; }
  </style>
</head>
<body>
  <h1>Data Saya</h1>
  <input id="cari" placeholder="Cari...">
  <table id="tabel"></table>
  <p id="status">Memuat data...</p>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="sheet.js"></script>
<script>
  (function () {
    'use strict';

    /* ===================== PENGATURAN ===================== */
    const SUMBER = "utama"; // harus sama dengan nama di sheet.js

    // Nama kolom di spreadsheet (tidak peka huruf besar/kecil).
    // Sesuaikan nanti setelah Anda memberi tahu nama kolomnya.
    const KOLOM = {
      tanggal: "Tanggal",
      toko: "Toko",
      sales: "Sales",
      nilai: "Nilai",
      target: "Target",
      realisasi: "Realisasi"
    };

    if (window.lucide) window.lucide.createIcons();

    /* ===================== HELPER ===================== */
    const $ = (id) => document.getElementById(id);
    const setText = (id, teks) => { const el = $(id); if (el) el.textContent = teks; };
    const buat = (tag, cls, teks) => {
      const el = document.createElement(tag);
      if (cls) el.className = cls;
      if (teks !== undefined) el.textContent = teks;
      return el;
    };
    const fmt = (n) => Number(n).toLocaleString("id-ID");
    const rupiahJt = (n) => "Rp " + (n / 1000000).toLocaleString("id-ID", { maximumFractionDigits: 1 }) + " jt";
    const jam = (d) => d ? d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }) : "-";

    // Ambil nilai kolom dari satu baris (objek) tanpa peka huruf besar/kecil
    function ambil(obj, nama) {
      const kunci = Object.keys(obj).find((k) => k.trim().toLowerCase() === nama.toLowerCase());
      return kunci ? String(obj[kunci]).trim() : "";
    }
    // Cek apakah kolom ada di spreadsheet
    function adaKolom(data, nama) {
      return data.header.some((h) => h.trim().toLowerCase() === nama.toLowerCase());
    }

    /* ===================== TOAST ===================== */
    let toastTimer = null;
    function toast(message) {
      $('toastText').textContent = message;
      $('toast').classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $('toast').classList.remove('show'), 3200);
    }

    /* ===================== MODE AKSES ===================== */
    const MODES = {
      reguler: {
        label: 'Mode Reguler',
        short: 'Reguler',
        hint: 'Akses standar untuk kunjungan harian, order, dan laporan penjualan sales.'
      },
      ub: {
        label: 'Mode Unit Bisnis (UB)',
        short: 'UB',
        hint: 'Akses khusus pengelolaan multi-unit bisnis, target UB, dan rekap distributor.'
      }
    };

    function applyMode(mode) {
      document.querySelectorAll('.mode-btn').forEach((btn) => {
        const aktif = btn.dataset.mode === mode;
        btn.dataset.active = aktif ? 'true' : 'false';
        btn.setAttribute('aria-pressed', aktif ? 'true' : 'false');
      });
      $('modeHint').textContent = MODES[mode].hint;
      $('ctaMode').textContent = MODES[mode].label;
      $('dashModeBadge').textContent = MODES[mode].short;
      $('dashModeText').textContent = MODES[mode].label;
    }

    document.querySelectorAll('.mode-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        applyMode(btn.dataset.mode);
        if (navigator.vibrate) navigator.vibrate(8);
      });
    });
    applyMode('reguler');

    /* ===================== TAB PWA ===================== */
    const pwaTabs = document.querySelectorAll('.pwa-tab');
    const panes = document.querySelectorAll('[data-pane]');
    pwaTabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        const target = tab.dataset.tab;
        pwaTabs.forEach((t) => t.setAttribute('aria-selected', t === tab ? 'true' : 'false'));
        panes.forEach((pane) => pane.classList.toggle('hidden', pane.dataset.pane !== target));
      });
    });

    /* ===================== NAVIGASI ===================== */
    let dashboardPushed = false;

    function formatTanggal(date) {
      try {
        return new Intl.DateTimeFormat('id-ID', {
          weekday: 'long', day: 'numeric', month: 'short', year: 'numeric'
        }).format(date);
      } catch (e) {
        return date.toDateString();
      }
    }

    function renderView(view) {
      const isDash = view === 'dashboard';
      const tampil = isDash ? $('viewDashboard') : $('viewLanding');
      const sembunyi = isDash ? $('viewLanding') : $('viewDashboard');

      sembunyi.classList.add('hidden');
      tampil.classList.remove('hidden');
      tampil.classList.remove('anim-in');
      void tampil.offsetWidth;
      tampil.classList.add('anim-in');

      window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
      if (isDash) $('dashDate').textContent = formatTanggal(new Date());
    }

    function goDashboard() {
      try {
        history.pushState({ view: 'dashboard' }, '');
        dashboardPushed = true;
      } catch (e) {
        dashboardPushed = false;
      }
      renderView('dashboard');
      if (navigator.vibrate) navigator.vibrate(12);
    }

    function goLanding() {
      if (dashboardPushed) history.back();
      else renderView('landing');
    }

    $('btnEnter').addEventListener('click', goDashboard);
    $('btnBack').addEventListener('click', goLanding);
    $('btnBack2').addEventListener('click', goLanding);

    window.addEventListener('popstate', (event) => {
      const view = event.state && event.state.view === 'dashboard' ? 'dashboard' : 'landing';
      dashboardPushed = view === 'dashboard';
      renderView(view);
    });

    try { history.replaceState({ view: 'landing' }, ''); } catch (e) {}

    /* ===================== BANTUAN & PASANG APLIKASI ===================== */
    $('btnHelp').addEventListener('click', () => {
      $('pwaGuide').scrollIntoView({ behavior: 'smooth', block: 'center' });
      toast('Panduan pemasangan aplikasi ada di bagian bawah 👇');
    });

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredPrompt = event;
    });
    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      toast('Aplikasi berhasil dipasang 🎉');
    });

    $('btnInstall').addEventListener('click', async () => {
      if (deferredPrompt) {
        try {
          deferredPrompt.prompt();
          const pilihan = await deferredPrompt.userChoice;
          if (pilihan && pilihan.outcome === 'accepted') toast('Aplikasi berhasil dipasang 🎉');
          else toast('Pemasangan dibatalkan. Anda bisa mencoba lagi nanti.');
        } catch (e) {
          toast('Gunakan menu browser → “Tambahkan ke Layar Utama”.');
        }
        deferredPrompt = null;
      } else {
        toast('Gunakan menu browser → “Tambahkan ke Layar Utama”.');
        $('pwaGuide').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });

    /* ===================== STATUS DATABASE ===================== */
    const GAYA_DB = {
      ok: {
        card: "flex items-center justify-between gap-3 rounded-2xl bg-emerald-50/80 px-3 py-2.5 ring-1 ring-inset ring-emerald-500/15",
        badge: "inline-flex shrink-0 items-center gap-1.5 rounded-full bg-emerald-500/15 px-2 py-1 text-[9px] font-extrabold uppercase tracking-wide text-emerald-700",
        label: "Terhubung"
      },
      memuat: {
        card: "flex items-center justify-between gap-3 rounded-2xl bg-slate-100/80 px-3 py-2.5 ring-1 ring-inset ring-slate-200",
        badge: "inline-flex shrink-0 items-center gap-1.5 rounded-full bg-slate-500/15 px-2 py-1 text-[9px] font-extrabold uppercase tracking-wide text-slate-600",
        label: "Memuat"
      },
      gagal: {
        card: "flex items-center justify-between gap-3 rounded-2xl bg-rose-50/80 px-3 py-2.5 ring-1 ring-inset ring-rose-200",
        badge: "inline-flex shrink-0 items-center gap-1.5 rounded-full bg-rose-500/15 px-2 py-1 text-[9px] font-extrabold uppercase tracking-wide text-rose-700",
        label: "Gagal"
      },
      kosong: {
        card: "flex items-center justify-between gap-3 rounded-2xl bg-amber-50/80 px-3 py-2.5 ring-1 ring-inset ring-amber-100",
        badge: "inline-flex shrink-0 items-center gap-1.5 rounded-full bg-amber-500/15 px-2 py-1 text-[9px] font-extrabold uppercase tracking-wide text-amber-700",
        label: "Belum diisi"
      }
    };

    function tampilStatus(data) {
      let gaya, sub;
      switch (data.status) {
        case 'ok':
          gaya = 'ok';
          sub = fmt(data.objects.length) + " baris · " + jam(data.updatedAt);
          break;
        case 'cache':
          gaya = 'memuat';
          sub = "Data tersimpan · memperbarui...";
          break;
        case 'memuat':
          gaya = 'memuat';
          sub = "Mengambil data dari spreadsheet...";
          break;
        case 'error':
          gaya = 'gagal';
          sub = data.objects.length
            ? "Gagal memperbarui · memakai data terakhir"
            : "Periksa link CSV dan Publish to web";
          break;
        default:
          gaya = 'kosong';
          sub = "Isi link CSV di sheet.js";
      }
      const g = GAYA_DB[gaya];
      $('dbCard').className = g.card;
      const badge = $('dbBadge');
      badge.className = g.badge;
      badge.innerHTML = '<span class="h-1.5 w-1.5 rounded-full bg-current"></span> ' + g.label;
      setText('dbSub', sub);
    }

    /* ===================== AKTIVITAS TERBARU ===================== */
    function tampilAktivitas(data) {
      const ul = $('aktivitasList');
      ul.innerHTML = "";

      const terbaru = data.objects.slice(-5).reverse();
      if (!terbaru.length) {
        ul.appendChild(buat('li', 'text-[11px] text-slate-400', 'Belum ada data.'));
        return;
      }

      terbaru.forEach((r) => {
        const nilai = SheetData.toNumber(ambil(r, KOLOM.nilai));
        const sub = [ambil(r, KOLOM.sales), ambil(r, KOLOM.tanggal)].filter(Boolean).join(" · ");

        const li = buat('li', 'flex items-center gap-2.5');

        const ikon = buat('span', 'grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-brand-50');
        ikon.appendChild(buat('span', 'h-2.5 w-2.5 rounded-full bg-brand-500'));

        const tengah = buat('div', 'min-w-0 flex-1');
        tengah.appendChild(buat('p', 'truncate text-[11.5px] font-bold text-ink-800', ambil(r, KOLOM.toko) || '(tanpa nama toko)'));
        tengah.appendChild(buat('p', 'truncate text-[10px] text-slate-400', sub || '-'));

        const kanan = buat('span', 'shrink-0 text-[10.5px] font-extrabold text-emerald-600', nilai > 0 ? rupiahJt(nilai) : '-');

        li.append(ikon, tengah, kanan);
        ul.appendChild(li);
      });
    }

    /* ===================== RENDER DATA ===================== */
    function render() {
      const data = SheetData.get(SUMBER);
      tampilStatus(data);

      const rows = data.objects;
      const kosong = rows.length === 0;

      const toko = new Set();
      const sales = new Set();
      let jumlahOrder = 0, totalNilai = 0, totalTarget = 0, totalRealisasi = 0;

      rows.forEach((r) => {
        const t = ambil(r, KOLOM.toko);
        if (t) toko.add(t);
        const s = ambil(r, KOLOM.sales);
        if (s) sales.add(s);

        const n = SheetData.toNumber(ambil(r, KOLOM.nilai));
        if (n > 0) { jumlahOrder++; totalNilai += n; }

        totalTarget += SheetData.toNumber(ambil(r, KOLOM.target));
        totalRealisasi += SheetData.toNumber(ambil(r, KOLOM.realisasi));
      });

      const punyaTarget = adaKolom(data, KOLOM.target) && adaKolom(data, KOLOM.realisasi) && totalTarget > 0;
      const pct = punyaTarget ? (totalRealisasi / totalTarget) * 100 : null;
      const pctText = pct === null ? "-" : pct.toFixed(1).replace(".", ",");

      // Beranda
      setText('landingPencapaian', kosong ? "-" : pctText);
      setText('landingPctSign', kosong || pct === null ? "" : "%");
      setText('landingKunjungan', kosong ? "-" : fmt(rows.length));
      setText('landingToko', kosong ? "-" : fmt(toko.size));
      setText('landingSales', kosong ? "-" : fmt(sales.size));

      // Dashboard
      setText('dashKunjungan', kosong ? "-" : fmt(rows.length));
      setText('dashKunjunganSub', "Total seluruh data");
      setText('dashOrder', kosong ? "-" : fmt(jumlahOrder));
      setText('dashOrderSub', rupiahJt(totalNilai));
      setText('dashToko', kosong ? "-" : fmt(toko.size));
      setText('dashTokoSub', "Toko unik");
      setText('dashTarget', kosong || pct === null ? "-" : pctText + "%");
      $('dashTargetBar').style.width = (pct === null ? 0 : Math.min(pct, 100)) + "%";

      tampilAktivitas(data);
      setText('dashFooterInfo', "Data spreadsheet · " + jam(data.updatedAt || new Date()));
    }

    /* ===================== MULAI ===================== */
    if (window.SheetData) {
      // Dipanggil saat data pertama kali tersedia dan setiap kali diperbarui
      SheetData.onUpdate(render);
    } else {
      tampilStatus({ status: 'error', objects: [], header: [] });
    }
  })();
</script>
</body>
</html>
