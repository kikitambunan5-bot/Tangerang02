<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Data Tim Sales · Tangerang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="min-h-screen bg-gradient-to-b from-indigo-50 via-slate-50 to-emerald-50 pb-10 text-slate-800">

  <header class="px-5 pt-6 pb-4">
    <a href="index.html" class="inline-flex items-center gap-1 text-sm font-semibold text-indigo-600">
      <span class="text-lg leading-none">‹</span> Kembali
    </a>
    <h1 class="mt-3 text-2xl font-extrabold text-slate-900">Data Tim Sales</h1>
    <p class="mt-1 text-sm text-slate-500">Tim Tangerang · Rizky Daniel</p>
  </header>

  <main class="mx-4">
    <section class="rounded-3xl bg-white p-5 shadow-sm">
      <div class="flex items-center justify-between gap-3">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Daftar PSR</p>
          <p id="jumlahPsr" class="mt-1 text-2xl font-extrabold text-slate-900">-</p>
        </div>
        <span id="statusBadge" class="rounded-full bg-slate-100 px-3 py-1 text-[11px] font-semibold text-slate-600">Memuat</span>
      </div>

      <input id="cariPsr" type="search" placeholder="Cari nama PSR..."
             class="mt-4 w-full rounded-2xl bg-slate-100 px-4 py-2.5 text-sm text-slate-800 outline-none focus:ring-2 focus:ring-indigo-200">

      <p id="listKosong" class="mt-4 hidden text-sm text-slate-500"></p>
      <ol id="listPsr" class="mt-2 divide-y divide-slate-100"></ol>
    </section>

    <p id="sumberInfo" class="mt-3 text-center text-[11px] text-slate-500"></p>
  </main>

  <script src="sheet.js"></script>
  <script src="nav.js"></script>
  <script>
  (function () {
    const SUMBER_PSR = "resumeGt";
    const BADGE = {
      memuat: ["Memuat", "bg-slate-100 text-slate-600"],
      ok: ["Terbaru", "bg-emerald-50 text-emerald-600"],
      cache: ["Dari cache", "bg-amber-50 text-amber-700"],
      error: ["Gagal", "bg-rose-50 text-rose-600"],
      kosong: ["Belum disambung", "bg-slate-100 text-slate-600"]
    };
    const PESAN_STATUS = {
      memuat: "Memuat daftar PSR...",
      error: "Gagal mengambil data. Periksa link CSV di sheet.js.",
      kosong: "Sumber belum disambungkan di sheet.js."
    };

    let semuaPsr = [];

    const $ = id => document.getElementById(id);

    // cari kolom nama PSR di header (toleran terhadap huruf besar/kecil)
    function cariKolomPsr(header) {
      const persis = header.find(h => String(h).trim().toUpperCase() === "NAMA PSR");
      if (persis) return persis;
      return header.find(h => /psr/i.test(String(h))) || null;
    }

    // mengembalikan null jika kolom PSR tidak ditemukan
    function ambilNamaPsr(d) {
      const kolom = cariKolomPsr(d.header || []);
      if (!kolom) return null;
      const hasil = [];
      (d.objects || []).forEach(r => {
        const nama = String(r[kolom] == null ? "" : r[kolom]).trim();
        if (!nama || /^(total|jumlah)/i.test(nama)) return;
        if (!hasil.includes(nama)) hasil.push(nama);
      });
      return hasil;
    }

    function tampilBadge(status) {
      const b = BADGE[status] || BADGE.memuat;
      const el = $("statusBadge");
      el.textContent = b[0];
      el.className = "rounded-full px-3 py-1 text-[11px] font-semibold " + b[1];
    }

    function tampilPesan(teks) {
      const p = $("listKosong");
      p.textContent = teks;
      p.classList.remove("hidden");
    }

    function sembunyikanPesan() {
      $("listKosong").classList.add("hidden");
    }

    function tampilDaftar() {
      const kata = ($("cariPsr").value || "").trim().toLowerCase();
      const ol = $("listPsr");
      ol.innerHTML = "";

      const tampil = semuaPsr.filter(n => n.toLowerCase().includes(kata));
      tampil.forEach(nama => {
        const no = semuaPsr.indexOf(nama) + 1;

        const li = document.createElement("li");
        li.className = "flex items-center gap-3 py-3";

        const nomor = document.createElement("span");
        nomor.className = "flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-indigo-50 text-xs font-bold text-indigo-600";
        nomor.textContent = no;

        const teks = document.createElement("span");
        teks.className = "break-words text-sm font-semibold text-slate-800";
        teks.textContent = nama;

        li.append(nomor, teks);
        ol.appendChild(li);
      });

      if (tampil.length === 0) {
        tampilPesan(semuaPsr.length ? "Tidak ada PSR yang cocok." : "Belum ada data PSR.");
      } else {
        sembunyikanPesan();
      }
    }

    function render() {
      const d = window.SheetData
        ? SheetData.get(SUMBER_PSR)
        : { status: "error", header: [], objects: [] };

      tampilBadge(d.status);

      const nama = ambilNamaPsr(d);
      if (nama === null) {
        semuaPsr = [];
        ol = $("listPsr");
        if (ol) ol.innerHTML = "";
        $("jumlahPsr").textContent = "-";
        if (d.status === "ok") {
          tampilPesan("Kolom PSR tidak ditemukan di sheet. Lihat Console (F12).");
          console.log("header resume by gt:", d.header);
        } else {
          tampilPesan(PESAN_STATUS[d.status] || "Memuat daftar PSR...");
        }
      } else {
        semuaPsr = nama;
        $("jumlahPsr").textContent = semuaPsr.length + " PSR";
        tampilDaftar();
      }

      $("sumberInfo").textContent = d.updatedAt
        ? "Diperbarui " + new Date(d.updatedAt).toLocaleString("id-ID")
        : "Sumber: sheet resume by gt";
    }

    $("cariPsr").addEventListener("input", tampilDaftar);
    if (window.lucide) window.lucide.createIcons();
    render();
    if (window.SheetData) SheetData.onUpdate(render);
  })();
  </script>
</body>
</html>
